name: EpicBook CI/CD

on:
  push:
    branches:
      - assignment-7-production
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/epicbook-frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/epicbook-frontend:latest \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/epicbook-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/epicbook-backend:latest \
            ./backend

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/epicbook-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/epicbook-frontend:latest

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/epicbook-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/epicbook-backend:latest

    deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Deploy EpicBook
        run: |
          set -e
          cd /home/ubuntu/theepicbook

          echo "Pulling images produced by CI..."
          docker compose pull frontend backend

          echo "Deploying EpicBook..."
          docker compose up -d

          echo "Waiting for services..."
          sleep 20

          docker compose ps

  verify:
    name: Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify public application
        run: |
          echo "Checking EpicBook deployment..."
          curl --fail --retry 10 --retry-delay 5 \
            http://${{ secrets.EC2_HOST }}/
          echo ""
          echo "EpicBook deployment verified successfully."
